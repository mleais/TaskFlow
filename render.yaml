databases:
  - name: taskflow-db
    databaseName: taskflow_v3
    user: taskflow_user
    plan: free

services:
  # .NET 9 Backend (Minimal API)
  - type: web
    name: taskflow-api
    runtime: docker
    dockerfilePath: ./TaskFlow.Backend/Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: TaskFlowApi
      - key: Jwt__Audience
        value: TaskFlowClient
      - key: CorsOrigins
        fromService:
          name: taskflow-ui
          type: web
          property: host

  # Vite React Frontend (Static Site)
  - type: web
    name: taskflow-ui
    runtime: static
    buildCommand: cd taskflow-ui && npm install && npm run build
    staticPublishPath: ./taskflow-ui/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        fromService:
          name: taskflow-api
          type: web
          property: host
